<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Management - Social Media CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body data-page="team" data-admin="true">
    <div id="sidebar" class="sidebar"></div>
    <div class="main-content">
        <div class="top-bar">
            <h1 id="pageTitle">Team Management</h1>
            <div class="user-menu">
                <span id="userName"></span>
                <button class="btn-logout" onclick="logout()" title="Logout" aria-label="Logout">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <div id="adminAccessDenied" class="interactions-container" hidden><h2>Administrator access required</h2><p class="mt-2">This page is available only to administrators.</p><a href="dashboard.html" class="btn btn-outline-primary mt-3">Back to dashboard</a></div>
        <main hidden>
        <!-- Team Management -->
        <div id="users-tab">
            <div class="interactions-container">
                <div class="interactions-header">
                    <h2>Team Management</h2>
                </div>
                <form id="createUserForm" class="row g-3 mb-4">
                    <div class="col-md-3">
                        <label class="form-label" for="newUsername">Username</label>
                        <input class="form-control" id="newUsername" minlength="3" maxlength="50" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="newUserEmail">Email</label>
                        <input class="form-control" id="newUserEmail" type="email" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="newUserPassword">Temporary password</label>
                        <input class="form-control" id="newUserPassword" type="password" minlength="10" maxlength="72" required>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-primary w-100" type="submit">Add agent</button>
                    </div>
                    <div class="col-12 small text-muted">New accounts are created as agents. Assign team-leader or admin roles from the team list.</div>
                </form>
                <div id="usersContent" aria-live="polite"></div>
            </div>
        </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="layout.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
