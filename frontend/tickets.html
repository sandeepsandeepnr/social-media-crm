<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets - Social Media CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body data-page="tickets">
    <div id="sidebar" class="sidebar"></div>
    <div class="main-content">
        <div class="top-bar">
            <h1 id="pageTitle">Tickets</h1>
            <div class="user-menu">
                <span id="userName"></span>
                <button class="btn-logout" onclick="logout()" title="Logout" aria-label="Logout">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <main>
        <!-- Tickets Tab -->
        <div id="tickets-tab">
            <div class="interactions-container">
                <div class="interactions-header">
                    <h2>Tickets</h2>
                    <div class="filter-controls">
                        <select class="filter-select" id="ticketStatusFilter" aria-label="Filter tickets by status" onchange="resetTicketPage()">
                            <option value="">All statuses</option>
                            <option value="open">Open</option>
                            <option value="in_progress">In progress</option>
                            <option value="pending">Pending</option>
                            <option value="resolved">Resolved</option>
                            <option value="closed">Closed</option>
                        </select>
                        <select class="filter-select" id="ticketPlatformFilter" aria-label="Filter tickets by platform" onchange="resetTicketPage()">
                            <option value="">All platforms</option>
                            <option value="facebook">Facebook</option>
                            <option value="instagram">Instagram</option>
                        </select>
                    </div>
                </div>
                <div id="ticketsContent" style="text-align: center; padding: 40px; color: #718096;">
                    <i class="bi bi-ticket" style="font-size: 48px; margin-bottom: 20px; display: block;"></i>
                    <p>Ticket management will be displayed here</p>
                </div>
                <nav id="ticketPagination" class="d-flex justify-content-between align-items-center mt-3" aria-label="Ticket pages"></nav>
            </div>
        </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="layout.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
