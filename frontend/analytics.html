<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Social Media CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body data-page="analytics">
    <div id="sidebar" class="sidebar"></div>
    <div class="main-content">
        <div class="top-bar">
            <h1 id="pageTitle">Analytics</h1>
            <div class="user-menu">
                <span id="userName"></span>
                <button class="btn-logout" onclick="logout()" title="Logout" aria-label="Logout">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <main>
        <!-- Analytics Tab -->
        <div id="analytics-tab">
            <div class="interactions-container">
                <h2>Analytics</h2>
                <div id="analyticsContent" style="text-align: center; padding: 40px; color: #718096;">
                    <i class="bi bi-graph-up" style="font-size: 48px; margin-bottom: 20px; display: block;"></i>
                    <p>Analytics and reports will be displayed here</p>
                </div>
            </div>
        </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="layout.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
